[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivyou-discovery"
version = "0.1.0"
description = "Evidence-backed discovery of Indian Shopify storefronts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "lxml>=5.3,<7", "phonenumbers>=9,<10",
  "protego>=0.4,<1", "tldextract>=5.1,<6", "pydantic>=2.10,<3",
  "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
rivyou = "rivyou.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/rivyou"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "BLE"]
